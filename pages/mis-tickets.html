<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tickets - TechSolve</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/scripts.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">
            <img src="../img/logo.jpg" alt="Logo TechSolve">
            <h1>TechSolve</h1>
        </div>
        <nav></nav>
    </header>

    <main>
        <section class="page-header">
            <h2>Mis Tickets</h2>
            <p>Consultá tus tickets registrados.</p>
        </section>

        <section class="content-card">
            <div class="table-container">
                <table class="tabla-tickets">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Categoría</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Prioridad</th>
                        </tr>
                    </thead>
                    <tbody id="ticketsTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>
</body>

</html>
