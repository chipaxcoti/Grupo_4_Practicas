<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Ticket - TechSolve</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="../img/logo.jpg" alt="Logo TechSolve">
            <h1>TechSolve</h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="login.html">Iniciar sesión</a></li>
                <li><a href="registrar-ticket.html" class="active">Registrar Ticket</a></li>
                <li><a href="mis-tickets.html">Mis Tickets</a></li>
                <li><a href="panel-tecnico.html">Panel Técnico</a></li>
            </ul>
        </nav>
    </header>

    <main>
        
        <section class="page-header">
            <h2>Registrar Ticket</h2>
            <p>Usa este formulario para crear un nuevo ticket de soporte técnico.</p>
        </section>
        
        <section class="content-card">
            <form action="procesar-ticket.php" method="POST" class="form-card">
                <div class="input-group">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Seleccione una categoría</option>
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                        <option value="red">Red</option>
                        <option value="otros">Otros</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="descripcion">Descripción del problema:</label>
                    <textarea id="descripcion" name="descripcion" rows="5" placeholder="Describe el problema..."></textarea>
                </div>

                <button type="submit" class="boton">Registrar Ticket</button>
        </section>
    </main>


</body>

</html>
