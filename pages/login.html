<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--el width=device usa el ancho real de la patalla y el initial-scale=1.0 es el zoom, por ende si ponemos 2.0 se vera el doble-->>
    <title>Iniciar sesión - TechSolve</title>
    <link rel="stylesheet" href="../css/styles.css">
    <!--Me lleva a styles-->
</head>

<body>
    <header>
        <div class="logo">
            <img src="../img/logo.jpg" alt="Logo TechSolve">
            <h1>TechSolve</h1>
        </div>
        <nav>
            <ul>
                <!--viñetas-->
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="login.html" class="active">Iniciar sesión</a></li>
                <li><a href="registrar-ticket.html">Registrar Ticket</a></li>
                <li><a href="mis-tickets.html">Mis Tickets</a></li>
                <li><a href="panel-tecnico.html">Panel Técnico</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h2>Iniciar sesión</h2>
            <p>Ingresa tus credenciales para acceder al sistema de soporte técnico.</p>
        </section>

        <section class="form-container">
            <div class="form-card">
                <form id="loginForm" autocomplete="off">
                    <div class="input-group">
                        <label for="user">Usuario</label>
                        <input type="text" id="user" name="user" placeholder="usuario" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Contraseña" required>
                    </div>

                    <button class="boton" type="submit">Ingresar</button>
                    <p class="error-message" id="errorMessage"></p>
                </form>
                <p class="small-text">Prueba con usuario <strong>admin</strong> y contraseña <strong>1234</strong>.</p>
            </div>
        </section>
    </main>


    <script>
        // Cobtador de usuarios y contraseñas
        const credentials = [
            { user: 'admin', password: '1234' },
            { user: 'empleado', password: 'ticket2026' }
        ];

        // Obtenemos el formulario y el lugar donde mostraremos mensajes de error.
        const form = document.getElementById('loginForm');
        const message = document.getElementById('errorMessage');

        // Cuando el usuario hace clic en "Ingresar" se ejecuta esta función.
        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Evita que la página se recargue.

            const userInput = document.getElementById('user').value.trim();
            const passwordInput = document.getElementById('password').value;

            // Buscamos un usuario que tenga el mismo nombre y contraseña.
            let matchedUser = null;

            for (let i = 0; i < credentials.length; i++) {
                const item = credentials[i];
                if (item.user === userInput && item.password === passwordInput) {
                    matchedUser = item;
                    break;
                }
            }

            if (matchedUser) {
                // Si los datos son correctos, guardamos el usuario y vamos a la página de tickets.
                localStorage.setItem('techsolveUser', matchedUser.user);
                window.location.href = 'mis-tickets.html';
            } else {
                // Si no encontró coincidencia, mostramos un mensaje de error.
                message.textContent = 'Usuario o contraseña incorrectos. Intenta de nuevo.';
            }
        });
    </script>
</body>

</html>
